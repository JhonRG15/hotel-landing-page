# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - organizappjr

on:
  push:
    branches:
      - nueva-rama

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Clonar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Debug para verificar estructura
      - name: Debug folders
        run: |
          echo "Directorio actual:"
          pwd

          echo "Contenido raíz:"
          ls -la

          echo "Contenido backend:"
          ls -la backend

      # Instalar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      # Instalar dependencias
      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      # Build
      - name: Build app
        working-directory: ./backend
        run: npm run build --if-present

      # Tests
      - name: Run tests
        working-directory: ./backend
        run: npm run test --if-present

      # Subir artefacto
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # Descargar artefacto
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./backend

      # Login Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_55704F1C297F445B9338475F680111BD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE7D1ACBF8BA4989A8D7074BF8A4B76C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_40DE40B6720C4046B38B1EBCA29A382E }}

      # Deploy Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'organizappjr'
          slot-name: 'Production'
          package: ./backend
